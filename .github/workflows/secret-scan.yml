# Secret scan (gitleaks 8.30.1, checksum-pinned). Added 2026-11-07 (security hygiene).
# - push / pull_request: scans only the NEW commits (old history is known and handled by key revocation)
# - workflow_dispatch: scans the current tree
# Findings are printed with values REDACTED. False positive -> add the fingerprint to .gitleaksignore.
name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gl.tgz

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          if [ "$EVENT" = "workflow_dispatch" ]; then
            exec gitleaks dir . --redact --verbose --no-banner
          fi
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$SHA"
          else
            RANGE="-1 $SHA"
          fi
          echo "scanning commits: $RANGE"
          gitleaks git . --log-opts="$RANGE" --redact --verbose --no-banner
